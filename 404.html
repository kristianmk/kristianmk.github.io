<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6f8">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <title>Not found · kristian.mk</title>
  <style>
    .not-found { min-height: 100svh; display: grid; place-items: center; padding: 32px; }
    .not-found-inner { width: min(100%, 780px); }
    .not-found-code { margin: 0 0 20px; color: var(--signal); font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .12em; }
    .not-found h1 { display: grid; margin: 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); font-size: clamp(58px, 13vw, 132px); line-height: .88; letter-spacing: -.065em; }
    .not-found h1 span { padding: 7px 0 4px; }
    .not-found h1 span + span { border-top: 1px solid var(--line); }
    .not-found p:not(.not-found-code) { max-width: 500px; margin: 25px 0 0; color: var(--muted); font-size: clamp(16px, 2.2vw, 20px); }
    .not-found a { display: inline-flex; align-items: center; margin-top: 31px; padding: 9px 0 7px; border-bottom: 2px solid var(--signal); font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .05em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="not-found"><div class="not-found-inner"><p class="not-found-code">404 / OUTSIDE INDEX</p><h1><span>Lost</span><span>signal.</span></h1><p>The requested page is not part of this research index.</p><a href="/">Return to kristian.mk</a></div></main>
</body>
</html>
